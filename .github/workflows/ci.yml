name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

jobs:
  # ============================================================
  # C++ 编译验证（使用本地一致的 OCCT 7.8.1 预编译包）
  # ============================================================
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----- 1. 下载预编译 OCCT 7.8.1（与你本地完全一致） -----
      - name: Download pre-built OCCT
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/occt-v1/occt-x64-windows-release.zip"
          Write-Host "Downloading OCCT 7.8.1 from Release..."
          Invoke-WebRequest -Uri $url -OutFile "${{ runner.temp }}/occt.zip"

      # ----- 2. 解压 -----
      - name: Extract OCCT
        run: |
          Expand-Archive -Path "${{ runner.temp }}/occt.zip" -DestinationPath "${{ github.workspace }}/vcpkg_installed" -Force
          Write-Host "OCCT 7.8.1 ready"

      # ----- 3. 设置 Python 3.11 -----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ----- 4. 切换到 CI CMakeLists -----
      - name: Prepare CI CMakeLists
        run: |
          Copy-Item CMakeLists.txt CMakeLists.local.bak.txt
          Copy-Item CMakeLists.ci.txt CMakeLists.txt -Force

      # ----- 5. CMake 配置 -----
      - name: Configure CMake
        run: |
          cmake -B build `
            -DPYTHON_INCLUDE_DIR="${{ env.pythonLocation }}/include" `
            -DPYTHON_LIBRARY="${{ env.pythonLocation }}/libs/python311.lib"

      # ----- 5. 编译 -----
      - name: Build
        run: cmake --build build --config Release

      # ----- 6. 验证 -----
      - name: Verify build output
        run: |
          if (Test-Path build/Release/_step_exporter.pyd) {
            Write-Host "PASS: _step_exporter.pyd built successfully"
            Get-Item build/Release/_step_exporter.pyd
          } else {
            Write-Host "FAIL: _step_exporter.pyd not found!"
            exit 1
          }

      # ----- 7. 上传产物 -----
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: step_exporter-pyd
          path: build/Release/_step_exporter.pyd
          retention-days: 7

      # ----- 8. 恢复 CMakeLists -----
      - name: Restore CMakeLists
        if: always()
        run: |
          if (Test-Path CMakeLists.local.bak.txt) {
            Copy-Item CMakeLists.local.bak.txt CMakeLists.txt -Force
            Remove-Item CMakeLists.local.bak.txt
          }

  # ============================================================
  # Python 单元测试（不需要 Blender，并行运行）
  # ============================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest step_exporter/tests/test_core_utils.py -v

  # ============================================================
  # Python 代码质量检查（并行运行，几秒完成）
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff

      - name: Lint Python files
        run: ruff check step_exporter/ --output-format=github
        continue-on-error: true
